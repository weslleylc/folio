name: 'folio'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.12.0"]

profile: 'folio'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  require_corrected_analysis_fqns: true

# Prefer project macros (DuckDB stand-ins) before the package.
dispatch:
  - macro_namespace: dbt_context_engineering
    search_order: ['folio', 'dbt_context_engineering']

on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

models:
  folio:
    bronze:
      +materialized: view
      +docs:
        node_color: "#CD7F32"   # bronze
    silver:
      +materialized: view
      +docs:
        node_color: "#C0C0C0"   # silver
    gold:
      +materialized: table
      +docs:
        node_color: "#D4AF37"   # gold
      # Gold / context store — chunks (free) + embeddings (billed, incremental, reusable).
      context_store:
        +docs:
          node_color: "#7C93B0"
        documents_embed:
          # Build the vector store alone with embeddings_enabled; ai_functions_enabled implies it.
          +enabled: "{{ var('embeddings_enabled', false) or var('ai_functions_enabled', false) }}"
      # Gold / structured domain tables — regex facts (free) + typed extract() (billed).
      structured:
        int_extract_corpus:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
        documents_extract:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
        documents_extract_flat:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
        int_period_gap_corpus:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
        documents_period_fallback:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
      # Gold / serving — use-case products on top of the store (billed, opt-in).
      serving:
        +enabled: "{{ var('ai_functions_enabled', false) }}"
        +docs:
          node_color: "#7FAFAF"
      governance:
        gov_classify_eval_pairs:
          +enabled: "{{ var('ai_functions_enabled', false) }}"
        gov_classify_eval:
          +enabled: "{{ var('ai_functions_enabled', false) }}"

  dbt_context_engineering:
    monitoring:
      +enabled: "{{ var('embeddings_enabled', false) or var('ai_functions_enabled', false) }}"

analyses:
  folio:
    the_pattern:
      +enabled: "{{ var('ai_functions_enabled', false) }}"

seeds:
  folio:
    +quote_columns: false
    +docs:
      node_color: "#7FA37F"
    raw_document_bodies:
      # Long markdown bodies need quoting.
      +quote_columns: true
  dbt_context_engineering:
    +enabled: "{{ var('embeddings_enabled', false) or var('ai_functions_enabled', false) }}"
