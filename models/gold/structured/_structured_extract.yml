version: 2

models:
  - name: int_extract_corpus
    description: Meridian-only truncated bodies for cost-gated typed extraction.

  - name: documents_extract
    description: >
      Typed credit-risk extraction via dbt_context_engineering.extract()
      (prompt/schema folio_credit_extract v1).

  - name: documents_extract_flat
    description: Flattened extract fields + source text for groundedness checks.
    columns:
      - name: evidence
        description: Verbatim quote backing primary_signal.
        tests:
          - dbt_context_engineering.grounded:
              arguments:
                source_text_column: extract_text
                allow_empty: true


  - name: int_period_gap_corpus
    description: >
      Hybrid extraction gap: docs where the regex found no fiscal period but the text mentions
      a quarter ("quarter ended ...", "third quarter of fiscal ..."). Only these reach the AI.

  - name: documents_period_fallback
    description: >
      AI extract() of the fiscal period for the regex gap only (prompt folio_period_extract v1).
      Incremental on (doc_id, silver_version_id, extract_version): each document is billed once.
    columns:
      - name: evidence
        description: Verbatim phrase backing the extracted period.
        tests:
          - dbt_context_engineering.grounded:
              arguments:
                source_text_column: extract_text
                allow_empty: true
