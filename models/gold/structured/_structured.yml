version: 2

# Gold / structured domain tables — deterministic facts and typed extraction from documents (article §6.1).

models:
  - name: gold_document_facts
    description: >
      Structured domain facts extracted from Silver markdown (past-due flags,
      covenant language, leverage mentions) with lineage to Bronze via sha256.
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: risk_signal_tier
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
  - name: gold_account_risk_rollup
    description: Account-level rollup of unstructured financial risk signals.
    columns:
      - name: account_id
        tests: [unique, not_null]

  - name: gold_document_periods
    description: >
      One fiscal period per silver_ready document, resolved hybrid: regex first (free), AI extract()
      only for the gap (documents_period_fallback), else not_found. fiscal_period_method tells which.
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: fiscal_period_method
        tests:
          - accepted_values:
              arguments:
                values: ['regex', 'ai', 'not_found', 'pending_ai']
