version: 2

models:
  - name: int_extract_corpus
    description: Meridian-only truncated bodies for cost-gated typed extraction.

  - name: documents_extract
    description: >
      Typed credit-risk extraction via dbt_context_engineering.extract()
      (prompt/schema folio_credit_extract v1).

  - name: documents_extract_flat
    description: Flattened extract fields + source text for groundedness checks.
    columns:
      - name: evidence
        description: Verbatim quote backing primary_signal.
        tests:
          - dbt_context_engineering.grounded:
              arguments:
                source_text_column: extract_text
                allow_empty: true

  - name: gov_classify_eval_pairs
    description: Predicted (chunk majority) vs golden labels for Meridian docs.

  - name: gov_classify_eval
    description: Package eval() metrics (accuracy / precision / recall) for classify taxonomy.
