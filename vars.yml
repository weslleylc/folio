vars:
  # Two independent switches (both default false so a local `dbt build` never spends):
  #
  #   embeddings_enabled   -> Gold / context store only: documents_embed (chunks are always built).
  #                           Use this to build a reusable vector store and decide later how to use it.
  #   ai_functions_enabled -> everything billed: store + classify / search / extract / evals.
  #                           Implies embeddings_enabled.
  #
  #   dbt build --vars '{"embeddings_enabled": true}'
  #   dbt build --vars '{"ai_functions_enabled": true}'
  embeddings_enabled: false
  ai_functions_enabled: false

  # Full re-embed opt-in (ADR-0030). Also unlocks --full-refresh of documents_classify
  # (override separately with allow_full_reclassify, intentionally not declared here).
  allow_full_reembed: false

  # Bronze landing batch (append-only log). Raise it to "receive" the next batch of files:
  #   --vars '{"bronze_max_batch": 2}'. Rebuilding history requires allow_bronze_rebuild=true
  # (intentionally not declared here, same pattern as allow_full_reclassify).
  bronze_max_batch: 2

  # BigQuery AI.GENERATE endpoints (short names). Prefer current Flash IDs from
  # https://cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate
  model_generate: "{{ 'mistral-large2' if target.type == 'snowflake' else 'databricks-claude-haiku-4-5' if target.type == 'databricks' else 'gemini-3.5-flash' }}"
  model_classify: "gemini-3.5-flash"
  # BigQuery extract() defaults to gemini-2.5-flash in the package — pin to the same Flash we use.
  model_extract: "gemini-3.5-flash"
  embedding_model: "{{ 'snowflake-arctic-embed-m-v1.5' if target.type == 'snowflake' else 'databricks-gte-large-en' if target.type == 'databricks' else 'text-embedding-005' }}"

  # Financial docs are denser than chatty tickets — slightly larger chunks.
  chunk_target_tokens: 120
  chunk_overlap_tokens: 0

  # --- Cost gates (dbt_context_engineering guard_batch + output caps) ---
  # Demo corpus is ~100 docs / a few thousand chunks after expand_corpus.py.
  # Ceilings still trip early if someone points the project at a large table.
  max_batch_rows: 5000
  max_est_tokens: 2000000
  max_output_tokens: 1024
  bq_thinking_budget: 0          # disable Gemini thinking tokens on classify
  cost_per_1k_tokens: 0.00015    # populate ai_run_log.est_cost (classify-ish blend)
  # Optional Vertex Cloud Resource Connection for scheduled (non-interactive) jobs:
  # bq_connection: "us.folio_vertex"

  embedding_canary_vector_dimension: 768

  # Demo search question — deliberately generic (no borrower name). Raw cosine drags in
  # boilerplate credit-facility text from healthy accounts; the label filter does not.
  search_query: "Which borrower is at risk of default?"
